name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned engine
        run: python3 scripts/fetch-engine.py
      - name: Unit tests
        run: bash scripts/test.sh
      - name: Package builds and verifies
        run: |
          bash scripts/build-app.sh
          bash scripts/verify-package.sh
